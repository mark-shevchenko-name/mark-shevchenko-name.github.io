<!doctype html>
<html lang="{{ page.lang | default: site.lang }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>{% if page.title %}{{ page.title | escape }}{% else %}{{ site.title | escape }}{% endif %}{% if paginator %} — страница {{ paginator.page }}{% endif %}</title>
    <meta name="description" content="{{ post.excerpt | default: page.description | default: site.description | strip_html | normalize_whitespace | escape }}{% if paginator %}, страница {{ paginator.page }}.{% endif %}">
    <meta name="google-site-verification" content="XFn1SC7tR-cl0E-eSmu4RhHF_HpIv6dPXbkFq3WukR8" />
    <meta name="yandex-verification" content="752e0174f484aab0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="{% link css/main.css %}">
    <link rel="canonical" href="{{ page.url | replace:'index.html','' | absolute_url }}">
    <link rel="icon" type="image/x-icon" href="{% link favicon.ico %}">
    <!-- Put this script tag to the <head> of your page -->
    <script type="text/javascript" src="https://vk.ru/js/api/openapi.js?168"></script>
    <script type="text/javascript">
      VK.init({ apiId: 54497079, onlyWidgets: true });
    </script>
  </head>
  <body>
    <header>
      <div class="container">
        <div class="row">
          <a class="col text-right header-title" href="/">Медвежий угол</a>
        </div>
      </div>
    </header>
    <nav class="container">
      <ul class="row navigation">
        <li class="col col-md-4 navigation-item"><a href="{% link blog/index.html %}">Журнал</a></li>
        <li class="col col-md-4 navigation-item"><a href="{% link lyrics/index.md %}">Стихи, песни</a></li>
        <li class="col col-md-4 navigation-item"><a href="{% link belles-lettres/index.md %}">Беллетристика</a></li>
      </ul>
    </nav>
    <article class="container">
      {{ content }}
    </article>
    <footer class="container text-center">
      Написать мне в <a href="tg://resolve?domain=markshevchenko"><img src="https://img.icons8.com/color/50/000000/telegram-app.png" style="width: auto; height: 1em" />Telegram</a>
    </footer>
  </body>
</html>
